name: Refresh conformance

# Pull-based freshness for the aggregated conformance snapshots.
#
# The spec repo owns the PUBLISHED_REPORTS registry, so it owns the polling —
# no implementation repo needs a cross-repo token or a sender workflow. A cheap
# `--check` pass detects whether any published report has actually DRIFTED from
# its committed snapshot; because the published report is timestamp-free, that is
# a true conformance-change signal, not a re-stamp. Only when something drifted
# does the job aggregate the changed implementations, validate, and open a PR.
#
# Runs with the repo's own GITHUB_TOKEN (intra-repo branch + PR — no PAT). Note:
# a GITHUB_TOKEN-opened PR does not re-trigger spec-check.yml, so this job runs
# validate_spec.py itself before opening the PR; the refresh is validated either
# way.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Detect drift and refresh snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect drift (cheap pre-check, no writes)
        id: detect
        run: |
          set -euo pipefail
          # Drifted/new impl names land on stdout (one per line); the per-impl
          # summary goes to stderr (visible in the job log).
          drifted=$(python scripts/aggregate_conformance.py --check)
          {
            echo "drifted<<EOF"
            echo "$drifted"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Aggregate drifted implementations and validate
        if: steps.detect.outputs.drifted != ''
        env:
          DRIFTED: ${{ steps.detect.outputs.drifted }}
        run: |
          set -euo pipefail
          while IFS= read -r impl; do
            [ -z "$impl" ] && continue
            echo "Refreshing $impl"
            python scripts/aggregate_conformance.py --impl "$impl"
          done <<< "$DRIFTED"
          # Validate the refreshed snapshots in-job, since the auto-PR below
          # (opened via GITHUB_TOKEN) will not re-trigger spec-check.yml.
          python scripts/validate_spec.py

      - name: Commit and open/update PR
        if: steps.detect.outputs.drifted != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFTED: ${{ steps.detect.outputs.drifted }}
        run: |
          set -euo pipefail
          if git diff --quiet -- conformance/; then
            echo "No net change after aggregation; nothing to open."
            exit 0
          fi
          BRANCH=auto/refresh-conformance
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add conformance/
          git commit -m "chore(conformance): refresh aggregated snapshots"
          git push -f origin "$BRANCH"
          # Open a PR only if one isn't already open for this branch; otherwise the
          # force-push above has already updated the existing PR.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')
          if [ -z "$existing" ]; then
            body=$(printf '%s\n' \
              "Automated refresh — these implementations' published \`conformance-report.json\` drifted from their committed snapshots:" \
              "" '```' "$DRIFTED" '```' "" \
              "Regenerated by \`scripts/aggregate_conformance.py\` and validated by \`scripts/validate_spec.py\` in the refresh job (a GITHUB_TOKEN PR does not re-trigger spec-check, by design). Review the diff and merge.")
            gh pr create --head "$BRANCH" --base main \
              --title "chore(conformance): refresh aggregated snapshots" \
              --body "$body"
          else
            echo "Updated existing PR #$existing"
          fi
