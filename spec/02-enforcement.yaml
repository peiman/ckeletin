# spec/enforcement.yaml
# Enforcement requirements for ckeletin-conformant CLI projects.

domain:
  name: Enforcement
  description: >
    Every architectural decision that can be checked by a tool must be.
    Enforcement prevents silent erosion of standards over time.
    Undocumented gaps are invisible — documented gaps are trackable.

requirements:
  - id: CKSPEC-ENF-001
    title: Automated enforcement required
    level: MUST
    since: v0.1.0
    verification: manual
    description: >
      Every architectural decision that CAN be verified by a tool
      MUST have automated enforcement. Manual review alone is
      insufficient — tooling catches violations consistently,
      regardless of who wrote the code or when.
    rationale: >
      Automated Enforcement (Principle 9) is the keystone: rules
      without enforcement erode silently. New contributors may not
      read every decision document. Automation ensures decisions
      survive team changes, time pressure, and human error.
      Truth-Seeking (Principle 1) demands that compliance be
      verified, not assumed.
    notes: >
      This requirement is itself not fully automatable — determining
      whether a decision CAN be automated requires human judgment.
      The enforcement audit (CKSPEC-ENF-004) makes gaps visible.

  - id: CKSPEC-ENF-002
    title: Enforcement ladder
    level: SHOULD
    since: v0.1.0
    modified: v0.10.0
    verification: manual
    description: >
      Enforcement SHOULD use the strongest feasible mechanism. From
      strongest to weakest: (1) compile-time — a violation fails to
      build (type system); (2) structural — a violation cannot build
      or is not built because of the project's structure (a dependency
      edge absent from the manifest, a source file outside any
      compilation unit); as strong as compile-time, achieved by the
      build graph / layout rather than a type error; (3) linter;
      (4) static analysis / SAST; (5) validator script; (6) automated
      test — a dedicated test asserts the property and gates CI;
      (7) CI-only check; (8) honor system (last resort). Higher levels
      catch violations earlier and cost less to maintain. This list is
      the enforcement_level vocabulary; the conformance schema enum and
      this ladder are the same set (SSOT) and MUST NOT drift.
    rationale: >
      Automated Enforcement (Principle 9) prefers mechanisms that
      catch violations as early as possible. Compile-time enforcement
      is free — violations don't build. Linter enforcement catches
      issues in the editor. Script-based checks run at commit time.
      CI catches what slips through. Honor system relies entirely on
      human discipline and fails under time pressure. Lean Iteration
      (Principle 4) favors the mechanism with the shortest feedback
      loop.
    notes: >
      The achievable enforcement level for a given requirement varies
      by language. Rust's module visibility can enforce directed
      dependencies at compile time; Go requires a linter tool for the
      same guarantee. Language-native compile-time enforcement is the
      ideal — the ladder describes fallback levels when compile-time
      is not available. Conformance reports capture the actual
      enforcement level per requirement (see enforcement_level in
      the conformance schema), making cross-implementation differences
      visible.
  - id: CKSPEC-ENF-003
    title: Document enforcement gaps
    level: MUST
    since: v0.1.0
    verification: partial
    description: >
      Architectural decisions that cannot be fully automated MUST
      explicitly document: what IS automated (and by which tool),
      what remains honor system, and why automation is not feasible.
    rationale: >
      Truth-Seeking (Principle 1) requires that gaps be acknowledged,
      not hidden. Undocumented gaps are invisible — they cannot be
      revisited when new tooling becomes available. Documented gaps
      are trackable and create a natural backlog for enforcement
      improvement.
  - id: CKSPEC-ENF-004
    title: Enforcement audit table
    level: MUST
    since: v0.1.0
    verification: partial
    description: >
      Projects MUST maintain a living enforcement audit table that
      tracks every architectural decision, its enforcement mechanism,
      enforcement status (full / partial / honor system), and any
      gaps. This table is the single source of truth for enforcement
      coverage.
    rationale: >
      Truth-Seeking (Principle 1) demands visibility into what is
      enforced and what is not. An audit table makes enforcement
      coverage visible at a glance. It reveals patterns — many
      honor-system entries signal enforcement debt — and drives
      investment in automation where it matters most. Automated
      Enforcement (Principle 9) requires knowing where automation
      is missing before it can be added.

  - id: CKSPEC-ENF-005
    title: Conformance mapping completeness
    level: MUST
    since: v0.3.0
    verification: automated
    description: >
      Conformance report generators MUST validate that their mapping
      covers every requirement in the target spec version before
      producing a report. Unmapped requirements MUST cause the
      generator to fail, not produce a partial report silently.
      The machine-readable requirement ID list from the spec is the
      completeness anchor.
    rationale: >
      Truth-Seeking (Principle 1) demands that conformance reports
      account for every requirement — a report that omits requirements
      creates false confidence. Automated Enforcement (Principle 9)
      requires that completeness be machine-checked, not left to human
      diligence. A generator that silently skips requirements is worse
      than no generator, because its output is trusted.

  - id: CKSPEC-ENF-006
    title: Violation tests for enforcement claims
    level: MUST
    since: v0.3.0
    modified: v0.4.0
    verification: automated
    description: >
      Enforcement claims above honor-system in conformance reports
      MUST be accompanied by proof that the enforcement mechanism
      works. The preferred proof is a violation test — a test that
      introduces a known violation and verifies the enforcement
      mechanism catches it. When a violation test is not feasible
      (structural or tooling-enforced enforcement), a
      violation_evidence field referencing the specific file(s)
      that constitute the enforcement is an acceptable alternative.
      If neither a violation test nor violation evidence can be
      provided, the enforcement level MUST be reported as
      honor-system.
    rationale: >
      Truth-Seeking (Principle 1) requires evidence, not claims.
      Stating that a linter catches a violation without demonstrating
      it is an untested assertion. Curiosity Over Certainty
      (Principle 2) demands that we verify our assumptions about
      what our tools actually catch. A conformance report that says
      "met at linter level" without a violation test is a hypothesis,
      not a fact. However, some enforcement mechanisms are provably
      real without a test file — a Cargo.toml that omits a dependency
      makes reverse imports structurally impossible. Requiring
      honor-system for structural enforcement would be dishonest —
      the enforcement is stronger than honor-system, and the report
      should say so. But violation_evidence is not a first resort:
      ckeletin-go initially classified ENF-006 as untestable, then
      found a real violation test after trying harder. Explore tests
      thoroughly before reaching for evidence.
    notes: >
      Violation tests verify the enforcement mechanism, not the
      requirement itself. A violation test for CKSPEC-ARCH-002 does
      not test that dependencies flow correctly — it tests that
      introducing a reverse dependency is caught by the enforcement
      tool. This is meta-testing: testing the tests.

      Two categories of enforcement where violation tests are not
      feasible: (1) structural — the enforcement IS the architecture
      (build config, dependency graph), not a runtime check,
      (2) tooling-enforced — enforcement wraps the codebase from
      outside (CI, hooks, toolchain). Originally proposed with four
      categories (adding self-referential and destructive-to-test);
      narrowed after ckeletin-go proved ENF-006 — initially
      classified as self-referential — was testable via a mapping
      consistency check. The lesson: try harder before reaching for
      violation_evidence. Discovered and refined through
      cross-implementation feedback between ckeletin-go and
      ckeletin-rust. See: Principle 10 (Feedback Cycle).

  - id: CKSPEC-ENF-007
    title: Automatic feedback signals
    level: SHOULD
    since: v0.3.0
    verification: automated
    description: >
      Conformance report generators SHOULD automatically include
      feedback signals when: (1) a checkable requirement has no
      automated check, (2) the enforcement level is lower than the
      spec's preferred level (per CKSPEC-ENF-002), or (3) a
      violation test is missing for a claimed enforcement level.
      These signals SHOULD be included in the report without human
      intervention, closing the feedback cycle structurally.
    rationale: >
      Feedback Cycle (Principle 10) requires that implementations
      feed learnings back to the spec. If feedback depends on someone
      remembering to write it down, it won't survive time pressure.
      Automated Enforcement (Principle 9) makes the signals automatic so
      the cycle closes itself — every conformance report is also a
      feedback report.

  - id: CKSPEC-ENF-008
    title: Anchored conformance evidence
    level: MUST
    since: v0.6.0
    verification: automated
    description: >
      Every requirement a conformance report marks as met MUST be
      anchored to verifiable evidence: either (1) an automated check
      the report names and a verifier can run, or (2) where automation
      is genuinely infeasible, an analysis-with-evidence that
      references the specific artifact(s) satisfying the requirement
      and states why no automated check is possible. A met status
      with neither an automated check nor an analysis-with-evidence
      anchor MUST cause the conformance generator to fail rather than
      emit an unanchored claim.
    rationale: >
      Truth-Seeking (Principle 1) demands that "met" mean "shown to be
      met", not "asserted to be met". CKSPEC-ENF-006 already requires
      proof for enforcement-level claims above honor-system; this
      requirement closes the remaining gap — without it a requirement
      could be reported met with no anchor at all. Not everything can
      be proven by an automated check (TDD ordering, editorial
      judgment, architectural properties), so analysis-with-evidence
      is a first-class anchor — but a bare claim is not. Anchoring
      every met-claim strictly is what surfaces gaps: a requirement
      that cannot be anchored is one whose conformance is actually
      unknown. Automated Enforcement (Principle 9) requires the anchor
      itself be machine-checked by the generator, not trusted.
    notes: >
      The two anchor kinds mirror the two proof kinds in
      CKSPEC-ENF-006 (automated check ≈ violation_test;
      analysis-with-evidence ≈ violation_evidence), extended from the
      enforcement-mechanism claim to the met-status claim itself.
      Strictness is deliberate: a softer rule that tolerated
      unanchored claims would hide exactly the gaps this requirement
      exists to reveal. The generator SHOULD report the split between
      automated and analysis-with-evidence anchors so enforcement debt
      stays visible (see CKSPEC-ENF-004). Discovered when ckeletin-go
      found it could mark requirements met with neither a check nor a
      justification — see Principle 10 (Feedback Cycle).

  - id: CKSPEC-ENF-009
    title: Conformance gate on release
    level: MUST
    since: v0.6.0
    modified: v0.9.0
    verification: automated
    description: >
      An implementation MUST continuously verify its conformance
      against the latest spec version, and MUST NOT publish a release
      while that verification fails. Conformance checking MUST be
      wired into an automated pipeline (for example a CI/CD release
      gate) so that drift from the latest spec blocks the release. The
      mechanism is the implementation's choice; the guarantee — no
      release while non-conformant — is not. The gate MUST declare its
      SUBJECT — what a green result proves: conformance of a named
      implementation, or that the repository is a project derived by
      scaffolding (CKSPEC-AGENT-007) that is not itself a ckeletin
      implementation and so has nothing to verify. A no-op gate — one
      that runs but checks nothing, e.g. a conformance step inherited by
      a scaffolded project where the generator short-circuits — MUST NOT
      count as ENF-009 satisfaction: it MUST announce that it verified
      nothing, never pass silently as if it had proved conformance.
    rationale: >
      Automated Enforcement (Principle 9) requires that conformance be
      verified by the pipeline, not by someone remembering to run a
      check before tagging. A report generated only by hand drifts
      silently between releases; tying it to the release gate makes
      "we conform" something the pipeline proves on every release
      rather than a claim. Truth-Seeking (Principle 1) demands the
      conformance claim be continuously true, not true only on the day
      it was last checked. Feedback Cycle (Principle 10) benefits
      because drift is caught at release time, when it is cheapest to
      address.
    notes: >
      "Continuously" means automated and at least gating every release
      — not a one-time or purely manual check. HOW is the
      implementation's choice: a CI job that runs the conformance
      generator and fails the release on drift, a pre-release hook, or
      a toolchain gate are all acceptable. ckeletin-go realizes this
      with a CKSPEC Conformance CI job that the release job depends on,
      plus a scheduled run that opens a drift issue. The spec mandates
      the gate, not the tool.

      Subject declaration (FB-004): a green gate is only meaningful if
      its subject is explicit. A ckeletin implementation's gate verifies
      that implementation against the spec. A project derived by
      scaffolding (CKSPEC-AGENT-007) inherits the release workflow but is
      not necessarily a ckeletin implementation; there the conformance
      step MUST either be absent or no-op-and-announce ("this repository
      is a derived project, not a ckeletin implementation — nothing to
      verify") so a green pipeline is never silently read as proven
      conformance it did not check. This closes the gap where an
      inherited gate hard-fails (blocking the consumer's own release) or
      silently passes (proving nothing). ckeletin-rust realizes the
      no-op-and-announce form: its conform recipes exit 0 with an
      explanation when the upstream slug is absent from the manifest, and
      the upstream-only conformance CI job is gated on repository
      identity — so a derived project's release is neither blocked nor
      falsely certified.

  - id: CKSPEC-ENF-010
    title: Published machine-readable conformance report
    level: MUST
    since: v0.7.0
    verification: automated
    description: >
      An implementation MUST publish a deterministic, machine-readable
      conformance report — a per-requirement projection of its own
      conformance mapping (status, evidence, and the checks or tests
      that anchor each claim). The report MUST be regenerable and
      guarded against drift from the mapping. The cross-implementation
      conformance view MUST be aggregated from these published reports,
      not hand-authored.
    rationale: >
      Single Source of Truth (Principle 7): a hand-authored
      per-implementation conformance report duplicates the
      implementation's own conformance data and drifts from it. When
      each implementation publishes a machine-readable report and the
      spec aggregates those, the implementation's mapping stays the one
      authoritative source and the cross-implementation view becomes
      reproducible rather than a manual transcription. Feedback Cycle
      (Principle 10): an aggregated machine-readable report is a
      retrospective the spec can consume directly, not a document
      someone must remember to keep current.
    notes: >
      Deterministic means the committed report is byte-stable across
      tool versions (extract the data with a parser, canonicalize the
      formatting) and carries no volatile field such as a timestamp, so
      a sync-check can prove it matches the mapping and the aggregator
      can stamp the fetch date. ckeletin-go realizes this with
      conformance-report.json (generated by gen-conformance-report.sh,
      sync-guarded by task conform) which the spec repo's
      aggregate_conformance.py consumes. HOW is the implementation's
      choice; the published, aggregatable report is not.

  - id: CKSPEC-ENF-011
    title: Tooling robustness to nested checkouts
    level: MUST
    since: v0.10.0
    verification: partial
    description: >
      Tooling that walks the project tree to enforce or verify conformance
      (linters, scanners, conformance generators) MUST bound its traversal to
      the project's own sources: it MUST NOT descend into nested repository or
      worktree checkouts (git worktrees, vendored module copies, nested
      modules), and MUST NOT silently pass or fail when unbuildable nested
      code is present. A scaffold with no tree-walking tooling satisfies this
      vacuously.
    rationale: >
      Truth-Seeking (Principle 1) — a gate that errors-and-skips, or walks a
      nested copy and flags its content, reports a result it never actually
      verified against the project's own sources. Automated Enforcement
      (Principle 9) — the enforcement tooling itself must be robust, not just
      the rules it checks.
    notes: >
      Surfaced by ckeletin-go #123 (reported by the daana-cli team): a
      file-walking scanner descended into Claude Code's worktree directory and
      broke on stale nested module checkouts. Stated as the class, not the
      instance — a tool's worktree dir is one example; vendored copies and
      nested modules are others. Both reference implementations already
      satisfy it: ckeletin-go bounds its walk with an explicit exclusion
      (#123); ckeletin-rust is immune by construction — its scanners are
      bounded target-collectors (named files + designated layer directories),
      not recursive tree-walks. verification is `partial`: a test confirms the
      tool handles specific nested-checkout cases, but the general "never
      breaks on any nested code" property is not fully machine-confirmable.
