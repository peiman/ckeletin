# spec/05-agent-readiness.yaml
# Agent readiness requirements for ckeletin-conformant CLI projects.

domain:
  name: Agent Readiness
  description: >
    How CLI projects communicate with AI agents. Universal project
    knowledge in a single guide, provider-specific behavioral tuning
    in dedicated files, and the CLI as the machine interface. No
    protocol layers required — the output domain provides the
    machine-readable responses, this domain provides the knowledge.

requirements:
  - id: CKSPEC-AGENT-001
    title: Universal agent guide
    level: MUST
    since: v0.2.0
    checkable: true
    description: >
      Projects MUST have an AGENTS.md file containing all project
      knowledge that any AI agent needs: architecture, commands,
      conventions, code organization, testing strategy, and
      troubleshooting. This file is the single source of project
      truth for agents.
    rationale: >
      Single Source of Truth (Principle 7) — one file, all project
      knowledge. Without a universal guide, each agent explores,
      reads, and guesses independently. A structured guide ensures
      consistent, correct behavior regardless of which agent is used.

  - id: CKSPEC-AGENT-002
    title: No provider-specific content in universal guide
    level: MUST
    since: v0.2.0
    checkable: true
    description: >
      AGENTS.md MUST NOT contain instructions specific to any single
      LLM provider. No Claude-specific rules, no Gemini-specific
      formatting, no Copilot-specific behaviors. Provider-specific
      content belongs in dedicated files.
    rationale: >
      Separation of Concerns (Principle 8) — universal knowledge
      and provider-specific behavior are different concerns. Mixing
      them creates confusion where agents follow instructions
      intended for a different LLM.

  - id: CKSPEC-AGENT-003
    title: Provider-specific guides follow provider guidance
    level: SHOULD
    since: v0.2.0
    checkable: false
    description: >
      When targeting specific LLMs, projects SHOULD create dedicated
      guide files (e.g., CLAUDE.md, GEMINI.md). These files SHOULD
      follow the respective provider's published optimization
      guidance. Provider-specific guides MUST reference AGENTS.md
      for project knowledge rather than duplicating it.
    rationale: >
      Each LLM processes instructions differently. Following
      provider guidance produces better results than a generic
      format. Single Source of Truth (Principle 7) — provider files
      add behavioral rules, not duplicate knowledge.

  - id: CKSPEC-AGENT-004
    title: Agent guide completeness
    level: SHOULD
    since: v0.2.0
    checkable: false
    description: >
      AGENTS.md SHOULD contain enough information for an agent to
      perform common tasks without reading additional documentation.
      At minimum: project purpose, directory structure, key commands
      (build, test, check), coding conventions, and troubleshooting.
    rationale: >
      Lean Iteration (Principle 4) — front-loading knowledge
      reduces agent exploration time and error rates. An agent that
      must discover project conventions through trial and error
      wastes tokens and makes mistakes. A complete guide makes the
      agent effective immediately.

  - id: CKSPEC-AGENT-005
    title: CLI as the agent interface
    level: MUST
    since: v0.2.0
    checkable: false
    description: >
      The CLI MUST be the primary interface for agent interaction.
      Agents run commands and parse responses (using the machine-
      readable output mode from CKSPEC-OUT-002). Protocol layers
      (MCP, custom APIs) MAY be provided as supplements but MUST
      NOT be required for agent operation. An agent with shell
      access and AGENTS.md MUST be able to use the project fully.
    rationale: >
      Lean Iteration (Principle 4) — the CLI is the simplest
      interface that works. Adding protocol layers for tools that
      already have CLIs adds complexity without capability.
      Platforms, Not Features (Principle 5) — the CLI and structured
      output are the platform; protocol wrappers are optional
      features built on that platform.

  - id: CKSPEC-AGENT-006
    title: Machine-readable command catalog
    level: SHOULD
    since: v0.8.0
    checkable: true
    description: >
      The CLI SHOULD expose its own command surface as machine-
      readable structured data — a catalog enumerating every command,
      its subcommands, flags, and which are required — emitted through
      the machine-readable output mode (CKSPEC-OUT-002): the catalog
      is the `data` of a success envelope, not a new output mode. The
      catalog MUST be DERIVED from the actual command definitions,
      never hand-maintained. Hidden commands and flags MAY be
      excluded; commands that accept external (dynamically-resolved)
      subcommands SHOULD indicate this rather than enumerate the
      unknowable. CKSPEC-OUT-002 makes a command's RESULT machine-
      readable; this makes the command SURFACE machine-readable.
    rationale: >
      Single Source of Truth (Principle 7) — AGENTS.md
      (CKSPEC-AGENT-001) documents the command surface in prose, which
      drifts from the code. A catalog derived from the command
      definitions cannot drift: it IS the command set. Truth-Seeking
      (Principle 1) — an agent discovers capabilities from structured
      data the binary self-reports, not by parsing human `--help`
      text. Feedback Cycle (Principle 10) — surfaced by ckeletin-rust
      while building haft, whose runtime-extensible command set makes
      a hand-written AGENTS.md surface impossible to keep current.
    notes: >
      Cross-implementation schema (agreed between the rust and go
      reference implementations on issue #9): a REQUIRED CORE both
      derive losslessly, plus OPTIONAL fields each emits where its CLI
      framework exposes them. Optional fields are omitted, never
      hand-filled, so "met" always means "derived". An agent's single
      parser keys off the required core; optional fields are
      best-effort enrichment.

      Required core — top level: name, description, global_flags
      (listed once, not duplicated per command), commands. Each
      command: name, description, flags, commands (recursive). Each
      flag: long, required, takes_value — a normalized
      value-consumes-vs-boolean-switch flag, the lossless
      intersection, NOT a rich type string (which clap cannot derive).

      Optional (emit where derivable): flag short, description,
      default, possible_values (enumerated values), rich type; command
      aliases, valid_args, positional_args, external_subcommands.

      Enforcement is a REGRESSION test, not a coverage-gap test: when
      the catalog is derived from the same command tree the parser
      uses (clap derive, cobra), the two cannot disagree, so a
      "command added without catalog coverage" failure mode is
      structurally impossible. A runtime-registry CLI (e.g. haft)
      derives from its registry, where a forgotten registration IS
      possible, so there the honest enforcement is a
      registration-completeness test. SHOULD, not MUST: a small
      single-command CLI gains little and AGENTS.md
      (CKSPEC-AGENT-004) remains the baseline; the benefit scales with
      surface size.
