# spec/04-output.yaml
# Structured output requirements for ckeletin-conformant CLI projects.

domain:
  name: Output
  description: >
    Three-stream output model with machine-readable mode and shadow
    logging. Ensures CLI projects serve both human and machine
    consumers — users get formatted text, agents get parseable JSON,
    and the audit trail captures everything.

requirements:
  - id: CKSPEC-OUT-001
    title: Three-stream output separation
    level: MUST
    since: v0.2.0
    verification: automated
    description: >
      Projects MUST separate output into three streams: (1) Data
      stream to stdout — the product of the command, (2) Status
      stream to stderr — progress, warnings, operational messages,
      (3) Audit stream to log file — full structured trace of what
      happened. These streams MUST NOT be mixed. Stdout MUST contain
      only the command's result, never log messages or progress text.
    rationale: >
      Separation of Concerns (Principle 8) applied to output.
      Mixing streams breaks shell pipelines (log messages in stdout),
      makes machine parsing unreliable (progress text interleaved
      with results), and loses audit context (user output is too
      brief for debugging). Three streams serve three audiences
      without compromise.

  - id: CKSPEC-OUT-002
    title: Machine-readable output mode
    level: MUST
    since: v0.2.0
    modified: v0.11.0
    verification: automated
    description: >
      Every command MUST support a machine-readable output mode
      activated via flag or configuration. When active, stdout MUST
      emit structured data (JSON or equivalent) instead of formatted
      text. The status stream (stderr) SHOULD be silenced in machine
      mode to produce clean parseable output.
    rationale: >
      Lean Iteration (Principle 4) — the CLI is the API. Agents,
      scripts, and CI pipelines need parseable responses without
      building protocol layers. A flag is simpler than a server.
      Truth-Seeking (Principle 1) — structured output is unambiguous,
      unlike human-formatted text that requires pattern matching.
    notes: >
      Flag convention (SHOULD): implementations SHOULD activate the mode
      with `--output <format>`, using `text` (default) and `json` as the
      standard values; additional formats (`yaml`, `table`) MAY be added
      as values. The MUST above is the machine-readable mode itself; the
      flag *name* is the SHOULD — so an agent can drive any ckeletin CLI
      with the same flag instead of discovering `--json` vs `--format
      json` per tool. Both reference implementations converged on
      `--output text|json` independently (Feedback Cycle, Principle 10);
      ckeletin-rust started with a boolean `--json` and switched to match.

      Parser/usage-error boundary (FB-005): machine-readable mode applies to
      command execution. Argument-parser and usage errors emitted by the CLI
      framework *before* a command resolves (e.g. Cobra or clap exiting on an
      unknown flag) MAY follow framework convention and need not be wrapped in
      the structured envelope; from configuration load onward, output MUST
      follow this requirement. Both reference implementations emit these
      pre-resolution errors as framework-native text today.

      Activation precedence (#17): when the output mode is set in more than one
      place, an explicit `--output` flag overrides configuration (file or env)
      in both directions — flag > config > default — for successes and errors
      alike. Resolution SHOULD come from one place — Single Source of Truth
      (Principle 7) — rather than being recomputed per call site; ckeletin-rust
      regressed here once (a config `json = true` silently overrode `--output
      text`) and fixed it with a single resolver. Both reference
      implementations resolve flag-over-config today.

      Exemptions (#25): a command MAY be exempt from this requirement when
      (a) its sole output is an artifact consumed directly by another program
      in a format that program dictates — a shell completion script
      (`source <(app completion bash)`), a man page — where wrapping it in the
      envelope would break the documented consumption contract; or (b) it is
      excluded from released builds (a build-tag- or feature-gated dev command).
      Exemptions MUST be declared (e.g. in the conformance report or command
      metadata), never silent — an agent must be able to tell an exempt command
      from one that simply forgot to support machine-readable mode.

  - id: CKSPEC-OUT-003
    title: Standardized output envelope
    level: SHOULD
    since: v0.2.0
    modified: v0.11.0
    verification: automated
    description: >
      Machine-readable output SHOULD use a standardized envelope
      with at minimum: status (success or error), command identifier,
      data payload, and error details. Commands MAY customize the data
      payload shape but the envelope structure SHOULD be consistent
      across all commands. The envelope is a TOTAL schema: when used,
      every key MUST be present in every envelope, and an absent value
      (data on error, error on success) MUST be emitted as JSON `null`,
      never omitted. A consumer can then parse any ckeletin CLI's output
      with one fixed key set instead of probing for optional keys. When the
      error field is populated, it SHOULD be a structured object — at minimum
      a human-readable `message`, plus a stable machine-readable `code` an
      agent can branch on without parsing prose (`null` when the implementation
      has none). The total-schema rule applies within the error object too:
      declared keys are always present, absent values are `null`.
    rationale: >
      Single Source of Truth (Principle 7) — one envelope format
      means consumers learn the structure once; a fixed key set is the
      thing learned. Platforms, Not Features (Principle 5) — a standard
      envelope is a platform that tooling, agents, and scripts build on,
      and a platform needs a stable, total shape rather than one whose
      keys appear and disappear. Truth-Seeking (Principle 1) — explicit
      `null` says "this field exists, no value"; an omitted key cannot be
      told apart from a field missing through a bug or an older binary.
      Automated Enforcement (Principle 9) — a total key set validates
      against one flat schema a conformance check can assert, where an
      omit-when-absent shape needs a conditional success/error schema.
    notes: >
      Resolved divergence (issue #19): the two reference
      implementations had diverged — ckeletin-go emits all four keys with
      explicit `null` (no `omitempty`), ckeletin-rust omitted absent keys
      (serde `skip_serializing_if`). The spec picks the TOTAL schema:
      present-and-null over omitted. The cost falls on ckeletin-rust (drop
      the two `skip_serializing_if` attributes on the envelope's data/error
      fields), not on go — the choice serves the consumer/platform, not
      whichever implementation is less work. Letting each implementation
      choose was rejected: it would defeat the cross-implementation point
      of OUT-003 (an agent parsing any ckeletin CLI the same way) and so
      violate Platforms, Not Features (Principle 5) and Single Source of
      Truth (Principle 7) across implementations.

      Error-object shape (#40, v0.11.0): the error field, when populated,
      SHOULD be a structured object `{ code, message }` — `message`
      human-readable, `code` a stable identifier an agent can branch on (or
      `null`). A bare error string is permitted but discouraged: an agent can
      switch on a `code` but not on prose. ckeletin-go already emits a
      JSONError object — its `code` drops `omitempty` to satisfy the
      total-schema present-and-null rule; ckeletin-rust moves from
      `error: Option<String>` to the structured object. The deeper nesting
      (per-field error details) is left open; the `{code, message}` core is
      the cross-implementation contract.

  - id: CKSPEC-OUT-004
    title: Shadow logging
    level: MUST
    since: v0.2.0
    modified: v0.11.0
    verification: automated
    description: >
      Every user-facing output operation MUST simultaneously log
      the raw data to the audit stream (log file). The audit log
      MUST contain at least the data that was rendered to the user,
      plus structured metadata (timestamp, command, log level). The
      audit stream is always active regardless of output mode.
      Failure semantics (#18): audit-stream initialization failure (e.g.
      an unwritable log directory) MUST surface as a normal error — the
      structured error envelope and a non-zero exit — never a panic or
      crash. The audit writer's lifetime MUST extend through error
      rendering, so error events reach the audit log: a command failure
      MUST NOT be recorded as a success or lost. A shadow-log event MUST
      NOT be emitted before the user-facing write it shadows, so a write
      that fails is not preceded by a log claiming it happened.
    rationale: >
      Truth-Seeking (Principle 1) — the audit log is the evidence
      of what happened. When debugging agent interactions or
      investigating failures, the user-visible output is often too
      brief. Shadow logging ensures the full context is always
      recoverable without requiring verbose mode. The failure semantics
      keep the log honest: an audit trail that records a failed command
      as succeeded, or that crashes the program when it cannot be
      written, is worse than no log.
    notes: >
      Generated artifacts (#26): for an operation whose output is a
      generated artifact (rendered documentation, a config file), the audit
      entry MAY record operation metadata — artifact type, destination, size,
      content hash — instead of the full content, provided the artifact is
      reproducible from versioned inputs. The audit value is "what happened";
      duplicating a multi-KB artifact into the log bloats it without adding
      auditability. Interactive output (messages, check results) still logs
      the rendered data.

  - id: CKSPEC-OUT-005
    title: Output isolation from business logic
    level: MUST
    since: v0.2.0
    verification: automated
    description: >
      Business logic MUST NOT write directly to stdout or stderr.
      All output MUST go through a rendering layer that handles
      format selection (human text vs machine-readable), shadow
      logging, and stream routing. This ensures that adding machine-
      readable output requires zero changes to business logic.
    rationale: >
      Separation of Concerns (Principle 8) — business logic produces
      data, the rendering layer formats it. Automated Enforcement
      (Principle 9) — this is checkable by static analysis (detect
      direct print/stdout usage in business logic packages).

  - id: CKSPEC-OUT-006
    title: Build identity in version output
    level: MUST
    since: v0.5.0
    verification: automated
    description: >
      The CLI MUST surface its build provenance in version output: at
      minimum the semantic version, the source commit identifier, a
      build-or-commit date, and whether the build came from a dirty
      (modified tracked files) working tree. Each field that cannot be
      resolved at build time MUST degrade to an explicit "unknown"
      rather than being omitted or fabricated.
    rationale: >
      Truth-Seeking (Principle 1) — provenance is evidence. An operator
      or agent debugging a deployed binary must be able to determine
      which commit produced it, and whether the tree was clean, without
      guessing. Single Source of Truth (Principle 7) — one version
      string, surfaced in both --version and any structured version
      command, keeps the human and machine views from drifting.
    notes: >
      Go bakes these via -ldflags (git describe --dirty, commit, date);
      Rust bakes them via a build script into compile-time env vars read
      at the call site. Runtime staleness checking — comparing the baked
      commit to the repo's current HEAD — is explicitly NOT required by
      this requirement; it is an operational diagnostic that belongs in a
      separate command.
