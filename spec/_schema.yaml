# spec/_schema.yaml
# Defines the structure of ckeletin specification requirements.
# Each spec domain file (architecture.yaml, testing.yaml, etc.)
# follows this format.
#
# This is the authoritative definition — future validation tooling
# will be built from this file.

domain:
  description: "Top-level key in each spec file. Groups related requirements."
  fields:
    name:
      type: string
      required: true
      description: "Human-readable domain name"
    description:
      type: string
      required: true
      description: "What this domain covers and why it matters"

requirement:
  description: "A single spec requirement within a domain."
  fields:
    id:
      type: string
      required: true
      format: "CKSPEC-<DOMAIN>-<NNN>"
      description: >
        Stable identifier. Prefix indicates domain (ARCH, ENF, TEST,
        CMD, CFG, AGENT, DOC, UPD, LIC, CI, WF). Number is sequential
        within domain and NEVER reused — retired requirements keep
        their number.
      examples:
        - "CKSPEC-ARCH-001"
        - "CKSPEC-TEST-003"
    title:
      type: string
      required: true
      description: "Short descriptive title"
    level:
      type: enum
      required: true
      values: [MUST, SHOULD, MAY]
      description: >
        RFC 2119 conformance level. MUST = absolute requirement.
        SHOULD = valid reasons to deviate exist, but implications
        must be understood. MAY = truly optional.
    since:
      type: string
      required: true
      format: "vX.Y.Z"
      description: "Spec version when this requirement was introduced"
    modified:
      type: string
      required: false
      format: "vX.Y.Z"
      description: "Spec version when last changed (omit if never changed)"
    verification:
      type: enum
      required: true
      values: [automated, partial, manual]
      description: >
        How much a machine can confirm this requirement is met (FB-007 /
        issue #34 — replaces the old boolean `checkable`, which claimed
        true/false for things that are really partly machine-checkable).
        automated = a tool verifies the actual property; a green check
        CONFIRMS the requirement is met. partial = a tool checks a
        necessary-but-not-sufficient proxy; the check can FALSIFY (catch a
        clear violation) but a green check does not confirm — human review or
        analysis closes the gap. manual = no meaningful machine check; the
        claim is established by human judgment OR a rigorous analytical
        argument (a proof, a probabilistic bound, a formal model) — analytical
        verification lives here too (it is strong but point-in-time, so a
        manual entry resting on analysis SHOULD state its assumptions). The
        per-implementation enforcement_level (above) captures HOW STRONGLY
        each impl enforces it; verification captures how verifiable the
        requirement IS, intrinsically.
    description:
      type: string
      required: true
      description: >
        What the requirement demands. Uses RFC 2119 keywords in ALL
        CAPS. Language-agnostic — describes WHAT, never HOW.
    rationale:
      type: string
      required: true
      description: "WHY this requirement exists. Links to principles."
    notes:
      type: string
      required: false
      description: "Additional context, caveats, or implementation hints"

conformance_entry:
  description: "How an implementation reports conformance to a requirement."
  fields:
    status:
      type: enum
      required: true
      values: [met, partial, not-met, not-applicable, deferred]
      description: >
        met = fully satisfied. partial = partly satisfied (notes
        explain gap). not-met = not satisfied. not-applicable =
        doesn't apply to this implementation. deferred = planned.
    evidence:
      type: string
      required: true
      description: "Code reference, file path, or explanation showing HOW"
    tests:
      type: list[string]
      required: false
      description: "Test names or paths that verify this requirement"
    enforcement_level:
      type: enum
      required: false
      values: [compile-time, structural, linter, sast, script, test, ci, honor-system]
      description: >
        How this requirement is verified in the implementation. This enum
        is the CKSPEC-ENF-002 ladder (strongest to weakest) and MUST NOT
        drift from it. compile-time = a violation fails to build.
        structural = a violation cannot build or is not built because of
        the project's structure (a dependency edge absent from the
        manifest, a source file outside any compilation unit) — as strong
        as compile-time, achieved by the build graph rather than a type
        error. linter / sast / script = automated-tooling rungs. test = a
        dedicated automated test asserts the property and gates CI. ci = a
        CI-only check. honor-system = documented convention, human
        discipline only (last resort). Implementations SHOULD report the
        strongest level that applies. Omit for non-checkable requirements
        reported via attestation. (`design` was retired in v0.10.0 — it
        spanned the whole ladder; its uses reclassify to structural at the
        strong end or honor-system at the weak end. See FB-001 / issue #16.)
    violation_test:
      type: string
      required: false
      description: >
        Path to a test that introduces a known violation and verifies
        the enforcement mechanism catches it. Preferred proof for
        enforcement claims above honor-system. Either violation_test
        or violation_evidence is required for claims above
        honor-system — without either, the enforcement level is
        unverified.
    violation_evidence:
      type: string
      required: false
      description: >
        For enforcement claims where a violation test file is not
        feasible (structural or tooling-enforced enforcement), an
        explanation referencing the specific file(s) that constitute
        the enforcement. Must include at least one file path.
        Accepted as alternative proof when violation_test is empty
        and enforcement_level is above honor-system. Not a
        substitute for trying harder — explore violation tests
        thoroughly before reaching for this field.
    notes:
      type: string
      required: false
      description: "Caveats, partial conformance, or feedback for spec"

conformance_report:
  description: "Top-level structure of a conformance report."
  fields:
    implementation:
      type: string
      required: true
      description: "Name of the implementation (e.g., ckeletin-go)"
    spec_version:
      type: string
      required: true
      description: "Which spec version this report targets"
    report_date:
      type: string
      required: true
      format: "YYYY-MM-DD"
      description: "When this report was last updated"
    requirements:
      type: map[requirement_id -> conformance_entry]
      required: true
      description: "Per-requirement conformance status"
